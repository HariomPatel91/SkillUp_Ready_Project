<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🧠 Brain Challenge - SkillUp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <header>
            <h1>🧠 Brain Challenge</h1>
            <p>Test your memory, logic and thinking skills!</p>
        </header>

        <div class="top-bar">
            <span>Score: <strong id="score">0</strong></span>
            <span>Question: <strong id="questionNumber">1</strong>/10</span>
        </div>

        <div class="game-card">

            <h2 id="question">
                Loading question...
            </h2>

            <div id="answers" class="answers"></div>

            <p id="result"></p>

            <button id="nextBtn" onclick="nextQuestion()" disabled>
                Next ➡️
            </button>

        </div>

        <div id="finalScreen" class="hidden">

            <h2>🎉 Challenge Complete!</h2>

            <p id="finalScore"></p>

            <button onclick="restartGame()">
                🔄 Play Again
            </button>

            <button onclick="goBack()">
                ⬅️ Back to SkillUp
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
