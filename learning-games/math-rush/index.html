<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🧠 Memory Match - SkillUp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🧠 Memory Match</h1>

        <p class="subtitle">
            Match all the pairs and test your memory!
        </p>

        <div class="game-info">

            <div>
                Moves:
                <strong id="moves">0</strong>
            </div>

            <div>
                Matches:
                <strong id="matches">0</strong>
            </div>

        </div>

        <div id="gameBoard" class="game-board"></div>

        <div id="message" class="message"></div>

        <button id="restartBtn" class="restart-btn">
            🔄 Restart Game
        </button>

        <button class="back-btn" onclick="goBack()">
            ⬅️ Back to SkillUp
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
